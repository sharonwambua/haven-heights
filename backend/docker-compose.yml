# Production-style stack: API + PostgreSQL.   docker compose up -d --build
# Put a reverse proxy with HTTPS (Caddy, Nginx) in front before exposing it; the app requires https in release builds.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: haven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: haven
    volumes: [dbdata:/var/lib/postgresql/data]
  api:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://haven:${POSTGRES_PASSWORD}@db:5432/haven
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads, ./firebase.json:/app/firebase.json:ro]
    ports: ["8000:8000"]
volumes:
  dbdata:
  uploads:
